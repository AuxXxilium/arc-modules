# ice for the 5.10 kernels built without NET_DEVLINK (geminilakenk): 1.17.8
# (src/ice) needs devlink, 1.9.11, the 4.4 release, still builds without it.
ORIGIN="https://github.com/intel/ethernet-linux-ice v1.9.11"
SERIES="5.10"
FETCH_URL="https://github.com/intel/ethernet-linux-ice/releases/download/v1.9.11/ice-1.9.11.tar.gz"
SUBDIR="src"
BUILD="intel"
UNLESS_OFFICIAL="CONFIG_NET_DEVLINK"

oot_prepare() {
  cp "${s}/arc-ice-nodevlink.c" src/
  printf '\nice-y += arc-ice-nodevlink.o\n' >>src/Makefile
}
