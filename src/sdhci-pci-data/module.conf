# sdhci_pci_get_data() for sdhci-pci. The official kernel leaves it out of
# vmlinux (MMC_SDHCI_PCI is off there, and this part is builtin-only), so
# it is built as a module of its own from the target's kernel source, as
# arc's prebuilt packages did.
ORIGIN="GPL kernel source: drivers/mmc/host/sdhci-pci-data.c"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/mmc/host/sdhci-pci-data.c"

oot_prepare() {
  grep -q MODULE_LICENSE sdhci-pci-data.c ||
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\nMODULE_DESCRIPTION("SDHCI PCI platform data hook (sdhci-pci)");\n' >>sdhci-pci-data.c
}
