# PLDM firmware update library (ice, ixgbe)
# The official kernel leaves this out of vmlinux (its bool is off), so the
# modules that need it cannot load. Built here as a module of its own from
# the target's kernel source, as arc's prebuilt packages did.
ORIGIN="GPL kernel source: lib/pldmfw/pldmfw.c lib/pldmfw/pldmfw_private.h"
SERIES="5.10"
KERNEL_FILES="lib/pldmfw/pldmfw.c lib/pldmfw/pldmfw_private.h"

oot_prepare() {
  # a lib file carries no MODULE_LICENSE: without it the module may not use
  # GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\nMODULE_DESCRIPTION("%s");\n' "PLDM firmware update library (ice, ixgbe)" >>"${f}"
  done
}
