# The BMC-side IPMI drivers (kcs_bmc core, kcs_bmc_aspeed, kcs_bmc_npcm7xx,
# bt-bmc), built on their own the way the prebuilt set had them (their
# Kconfig wants ARCH_ASPEED/ARCH_NPCM7XX): bt-bmc and kcs_bmc_aspeed use
# regmap-mmio (src/regmap_mmio). They load; they bind only the device-tree
# nodes of those SoCs.
ORIGIN="GPL kernel source: drivers/char/ipmi/{kcs_bmc*,bt-bmc}.[ch]"
SERIES="5.10"
KERNEL_FILES="drivers/char/ipmi/kcs_bmc.[ch] drivers/char/ipmi/kcs_bmc_aspeed.c drivers/char/ipmi/kcs_bmc_npcm7xx.c drivers/char/ipmi/bt-bmc.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
