# gpio-beeper where the official kernel has no GPIOLIB (broadwell*): built on
# its own against the header's gpiolib stubs, the way the prebuilt set had it.
# It loads; without gpiolib it gets no GPIO and binds nothing.
ORIGIN="GPL kernel source: drivers/input/misc/gpio-beeper.c"
SERIES="4.4"
UNLESS_OFFICIAL="CONFIG_GPIOLIB CONFIG_INPUT_GPIO_BEEPER"
KERNEL_FILES="drivers/input/misc/gpio-beeper.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
