# mlx4_core and mlx4_en for the 5.10 kernels built without NET_DEVLINK
# (geminilakenk), from the target's kernel source with a private devlink
# (arc-devlink.c, linked into each module, exporting nothing): the drivers
# live in devlink's private area, so they cannot do without one, but nothing
# on a NAS uses the devlink netlink interface. mlx4_ib needs the InfiniBand
# core, which these kernels cannot have (IRQ_POLL off).
ORIGIN="GPL kernel source: drivers/net/ethernet/mellanox/mlx4 + arc-devlink.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_NET_DEVLINK"
KERNEL_FILES="drivers/net/ethernet/mellanox/mlx4"
SUBDIR="mlx4"
MAKE_ARGS="CONFIG_MLX4_CORE=m CONFIG_MLX4_EN=m CONFIG_MLX4_CORE_GEN2=y"

oot_prepare() {
  cp "${s}/arc-devlink.c" mlx4/arc-devlink-core.c
  cp "${s}/arc-devlink.c" mlx4/arc-devlink-en.c
  printf '\nmlx4_core-y += arc-devlink-core.o\nmlx4_en-y += arc-devlink-en.o\n' >>mlx4/Makefile
}
