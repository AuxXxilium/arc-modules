# Marvell (QLogic) FastLinQ 8.59.6.0: qed, qede (25/50/100G Ethernet) and
# qedr (RoCE/iWARP), the version the prebuilt set had; the kernels' own are
# 8.4.0.0 (4.4) and 8.37.0.20 (5.10). Marvell ships the source only inside a
# source RPM; the tarball in it is built. qedf/qedi (FCoE/iSCSI offload)
# stay out: the prebuilt set did not have them either. The firmware it
# loads (qed/qed_init_values_zipped-8.59.3.0.bin) is in arc's firmware set.
ORIGIN="https://www.marvell.com/content/dam/marvell/en/drivers/ldriver/fastlinq/qlgc-fastlinq-8.59.6.0-1.rhel8u5.src.rpm (fastlinq-8.59.6.0.tgz)"
SERIES="4.4 5.10"
FETCH_URL="https://www.marvell.com/content/dam/marvell/en/drivers/ldriver/fastlinq/qlgc-fastlinq-8.59.6.0-1.rhel8u5.src.rpm"
FETCH_KEY="qlgc-fastlinq-8.59.6.0-1.rhel8u5.src.rpm"
FETCH_INNER="fastlinq-8.59.6.0.tgz"
FETCH_UA="Wget"
BUILD="make"
MAKE_ARGS="KVER=@RELEASE@ KERNEL_DIR=@KSRC@ LINUXSRC=@KSRC@ DISABLE_WERROR=1 subsystem"

oot_prepare() {
  # qed, qede and qedr only; ${PWD} is the caller's folder under make -C
  sed -i -e 's|^SUBDIRS := .*|SUBDIRS := $(QED_DIR) $(QEDE_DIR) $(QEDR_DIR)|' \
    -e 's|\${PWD}|$(CURDIR)|g' Makefile
  grep -q '^SUBDIRS := $(QED_DIR) $(QEDE_DIR) $(QEDR_DIR)$' Makefile
  # qedr needs the InfiniBand core, which geminilakenk cannot build (it
  # needs IRQ_POLL)
  if ! grep -qE '^CONFIG_INFINIBAND=[my]' "${OOT_KSRC}/.config"; then
    sed -i 's|^SUBDIRS := $(QED_DIR) $(QEDE_DIR) $(QEDR_DIR)$|SUBDIRS := $(QED_DIR) $(QEDE_DIR)|' Makefile
  fi
  # Kernels built without NET_DEVLINK (geminilakenk): qed without its devlink
  # part (health reporters, info), as on kernels too old for it.
  if ! grep -q '^CONFIG_NET_DEVLINK=y' "${OOT_OFFICIAL_CONFIG}"; then
    sed -i 's|^ifneq ($(shell grep "devlink_health_reporter_ops".*|ifneq (,)|' qed-*/src/Makefile
  fi
  # qede forces CONFIG_DCB; without DCB in the kernel, qede without its DCB
  # part
  if ! grep -q '^CONFIG_DCB=y' "${OOT_OFFICIAL_CONFIG}"; then
    sed -i 's/ -DCONFIG_DCB$//' qede-*/src/Makefile
  fi
  # Synology's 4.4 already has page_ref_count() (not page_ref_inc()): only
  # the one the kernel lacks stays in qede's compat header
  if grep -q 'static inline int page_ref_count' "${OOT_KSRC}/include/linux/mm.h"; then
    sed -i '/^static inline int page_ref_count/,/^}/d' qede-*/src/qede_compat.h
  fi
}
