# Realtek r8126 10.018.00 (5G), vendor driver via awesometic's DKMS package.
ORIGIN="https://github.com/awesometic/realtek-r8126-dkms fbf668194052 (10.018.00)"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/awesometic/realtek-r8126-dkms/tar.gz/fbf668194052211599594daa3d722c5c519d4c25"
FETCH_KEY="r8126-10.018.00-fbf668194052.tar.gz"
SUBDIR="src"
MAKE_ARGS="ENABLE_RSS_SUPPORT=y ENABLE_MULTIPLE_TX_QUEUE=y ENABLE_S5_KEEP_CURR_MAC=y"

# Synology's 4.4 predates NETIF_F_CSUM_MASK (4.5), the old name is
# NETIF_F_ALL_CSUM.
oot_prepare() {
  if ! grep -q NETIF_F_CSUM_MASK "${OOT_KSRC}/include/linux/netdev_features.h"; then
    sed -i '0,/^#include/s//#define NETIF_F_CSUM_MASK NETIF_F_ALL_CSUM\n#include/' src/r8126_n.c
  fi
}
