# intel_auxiliary on 4.4: Intel's standalone auxiliary bus as newer Intel
# releases build it (symbols and bus named intel_auxiliary_*, so it can sit
# next to the kernel's or another driver's "auxiliary"), the module the
# prebuilt set had there. The 4.4 releases of i40e/ice/iavf built here use
# their own "auxiliary" module; this one is built alone from i40e 2.30.83's
# source (i40e itself no longer builds on 4.4). On 5.10 i40e, iavf and ice
# build it themselves.
ORIGIN="https://github.com/intel/ethernet-linux-i40e v2.30.83 (src/auxiliary.c)"
SERIES="4.4"
FETCH_URL="https://github.com/intel/ethernet-linux-i40e/releases/download/v2.30.83/i40e-2.30.83.tar.gz"
SUBDIR="src"
BUILD="intel"
# Intel's build makes the bus where the kernel has none (NEED_AUX_BUS=2)
MAKE_ARGS="NEED_AUX_BUS=2"

oot_prepare() {
  # only the bus: i40e's own objects stay out of the kbuild part
  sed -i 's/^obj-m += i40e.o$/# i40e left out (arc-modules: only intel_auxiliary)/' src/Makefile
  grep -q '^# i40e left out' src/Makefile
}
