# devlink (devlink.ko), the NET_DEVLINK bool geminilakenk is built without, as
# a module from the target's kernel source, the way the prebuilt set had it:
# vmlinux has only the header's stubs for it (ethtool's devlink fallbacks),
# and no struct the kernel shares depends on it. Our configuration turns
# NET_DEVLINK on (abi-allow.list), so mlx4/mlx5, mlxsw, bnxt_en, hinic, qed,
# ice and ixgbe use it. Its tracepoints are its own (devlink.c defines them).
ORIGIN="GPL kernel source: net/core/devlink.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_NET_DEVLINK"
KERNEL_FILES="net/core/devlink.c"

oot_prepare() {
  # get_net_ns_by_id() is not exported: a reload into a namespace given by
  # its id (DEVLINK_ATTR_NETNS_ID) is refused (-EINVAL, the code's own
  # answer to an unknown id); by pid or fd it works. The prebuilt devlink.ko
  # had no such reload either.
  sed -i 's|^#include <trace/events/devlink.h>$|#include <trace/events/devlink.h>\n\n/* arc-modules: get_net_ns_by_id() is not exported by vmlinux */\n#define get_net_ns_by_id(ns, nsid) ((struct net *)NULL)|' devlink.c
  grep -q '^#define get_net_ns_by_id' devlink.c
  grep -q MODULE_LICENSE devlink.c || printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>devlink.c
}
