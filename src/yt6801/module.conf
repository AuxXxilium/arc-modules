# Motorcomm YT6801 1G, vendor driver 1.0.34 (Motorcomm's tarball, imported
# unchanged by CSharperMantle).
ORIGIN="https://github.com/CSharperMantle/yt6801-tarball v1.0.34"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/CSharperMantle/yt6801-tarball/tar.gz/refs/tags/v1.0.34"
FETCH_KEY="yt6801-1.0.34.tar.gz"
SUBDIR="src"

# its Makefile finds its headers through $(PWD), which is not the module
# folder in an M= build
oot_prepare() {
  sed -i 's/-I$(PWD)/-I$(src)/' src/Makefile
  grep -q -- '-I$(src)' src/Makefile
}
