# Intel e1000e 3.8.7, Intel's out-of-tree driver (SourceForge release,
# mirrored unchanged by whatboxapp), for 4.4: the kernel's own is 3.2.6-k.
# 5.10's in-tree e1000e is what the prebuilt set used there too.
ORIGIN="https://github.com/whatboxapp/e1000e-3.8.7 1142c5a2d6aa"
SERIES="4.4"
FETCH_URL="https://codeload.github.com/whatboxapp/e1000e-3.8.7/tar.gz/1142c5a2d6aaf6a357d27cff536e8e76aedaa5de"
FETCH_KEY="e1000e-3.8.7-1142c5a2d6aa.tar.gz"
SUBDIR="src"
BUILD="intel"

# With PTP: every 4.4 kernel has PTP_1588_CLOCK built in. Only the 4.6
# cross-timestamping (get_device_system_crosststamp(), convert_art_to_tsc())
# is missing from Synology's 4.4; the driver guards that part with
# CONFIG_PTP_1588_CLOCK instead of its own HAVE_PTP_CROSSTIMESTAMP (defined
# from 4.6 on), so it is told the right guard. The PHC, hardware time stamps
# and the rest of PTP stay.
oot_prepare() {
  awk 'prev == "#ifdef CONFIG_PTP_1588_CLOCK" && ($0 ~ /MAX_HW_WAIT_COUNT|CPU must have ART/) { prev = "#ifdef HAVE_PTP_CROSSTIMESTAMP" }
       NR > 1 { print prev } { prev = $0 } END { print prev }' src/ptp.c >src/ptp.c.new
  mv src/ptp.c.new src/ptp.c
  [ "$(grep -c '^#ifdef HAVE_PTP_CROSSTIMESTAMP$' src/ptp.c)" = 2 ]
}
