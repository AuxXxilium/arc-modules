# The power-supply class (power_supply.ko), a bool the official 5.10 kernels
# have off, as a module from the target's kernel source, the way the prebuilt
# set had it: vmlinux has no code that uses it (its callers there are built
# against the header's stubs), and no struct the kernel shares depends on it.
# Our configuration turns POWER_SUPPLY on (abi-allow.list), so the drivers
# built as modules here (tcpm, gpio-charger, amdgpu, the ACPI AC/battery and
# charger drivers) use this class.
ORIGIN="GPL kernel source: drivers/power/supply/power_supply_{core,sysfs,leds,hwmon}.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_POWER_SUPPLY"
KERNEL_FILES="drivers/power/supply/power_supply.h drivers/power/supply/power_supply_core.c drivers/power/supply/power_supply_sysfs.c drivers/power/supply/power_supply_leds.c drivers/power/supply/power_supply_hwmon.c"
oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
