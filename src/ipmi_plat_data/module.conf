# IPMI platform data and DMI decoding (ipmi_si, ipmi_ssif)
# The official kernel leaves this out of vmlinux (its bool is off), so the
# modules that need it cannot load. Built here as a module of its own from
# the target's kernel source, as arc's prebuilt packages did.
ORIGIN="GPL kernel source: drivers/char/ipmi/ipmi_plat_data.c drivers/char/ipmi/ipmi_plat_data.h drivers/char/ipmi/ipmi_dmi.c drivers/char/ipmi/ipmi_dmi.h"
SERIES="5.10"
KERNEL_FILES="drivers/char/ipmi/ipmi_plat_data.c drivers/char/ipmi/ipmi_dmi.c"

oot_prepare() {
  # a lib file carries no MODULE_LICENSE: without it the module may not use
  # GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\nMODULE_DESCRIPTION("%s");\n' "IPMI platform data and DMI decoding (ipmi_si, ipmi_ssif)" >>"${f}"
  done
}
