# Realtek r8127 11.017.02 (10G), the vendor driver as Realtek releases it
# (OpenWrt's mirror of the tarball, byte-identical to the one in ELRepo's
# kmod-r8127 11.017.02 source RPM). Same options as the prebuilt 11.016.00
# (NAPI-DASH-RSS).
ORIGIN="https://github.com/openwrt/rtl8127/releases/download/11.017.02/r8127-11.017.02.tar.bz2"
SERIES="4.4 5.10"
FETCH_URL="https://github.com/openwrt/rtl8127/releases/download/11.017.02/r8127-11.017.02.tar.bz2"
SUBDIR="src"
MAKE_ARGS="ENABLE_DASH_SUPPORT=y ENABLE_RSS_SUPPORT=y ENABLE_MULTIPLE_TX_QUEUE=y ENABLE_S5_KEEP_CURR_MAC=y"

# Synology's 4.4 predates NETIF_F_CSUM_MASK (4.5), the old name is
# NETIF_F_ALL_CSUM; its PCI_CFG_SPACE_EXP_SIZE is private to drivers/pci.
oot_prepare() {
  if ! grep -q NETIF_F_CSUM_MASK "${OOT_KSRC}/include/linux/netdev_features.h"; then
    sed -i '0,/^#include/s//#define NETIF_F_CSUM_MASK NETIF_F_ALL_CSUM\n#include/' src/r8127_n.c
  fi
  if ! grep -rq 'define PCI_CFG_SPACE_EXP_SIZE' "${OOT_KSRC}/include"; then
    sed -i '0,/^#include/s//#define PCI_CFG_SPACE_EXP_SIZE 4096\n#include/' src/rtltool.c
  fi
}
