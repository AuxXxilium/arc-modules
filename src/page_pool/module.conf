# page_pool (page_pool.ko), the PAGE_POOL bool geminilakenk is built without,
# as a module from the target's kernel source, the way the prebuilt set had
# it, for mlx5_core and bnxt_en. vmlinux has only the header's stubs (in the
# XDP code: pages an XDP redirect hands back to such a pool are not
# recycled there), and no struct the kernel shares depends on it. Its
# tracepoints, which net-traces.c would define, are defined here.
ORIGIN="GPL kernel source: net/core/page_pool.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_PAGE_POOL"
KERNEL_FILES="net/core/page_pool.c"

oot_prepare() {
  sed -i 's|^#include <trace/events/page_pool.h>$|#define CREATE_TRACE_POINTS\n#include <trace/events/page_pool.h>|' page_pool.c
  grep -q "^#define CREATE_TRACE_POINTS" page_pool.c
  grep -q MODULE_LICENSE page_pool.c || printf '\nMODULE_LICENSE("GPL");\n' >>page_pool.c
}
