# Mellanox OFED 4.1-1.0.2.0 (mlnx-ofa_kernel c22af88), the RDMA stack and
# the mlx4/mlx5 drivers DSM itself ships on these platforms (Synology-signed
# mlx_compat, ib_core, mlx4_core/en/ib and mlx5_core/ib 4.1-1.0.2, built from
# the same mlnx-ofa_kernel commit, which the prebuilt set copied). The
# kernel's own 2.2-1/3.0-1 drivers and InfiniBand core differ from DSM's in
# structures and exports, so here the whole family comes from OFED; the
# kernel's other RDMA drivers, built against its own ib_core, do not ship
# there (collect.py). apollolake and geminilake DSM has no OFED: the kernel's
# drivers stay. arc-ofed.mk runs OFED's configure and build.
ORIGIN="https://linux.mellanox.com/public/repo/mlnx_ofed/4.1-1.0.2.0/SRPMS/mlnx-ofa_kernel-4.1-OFED.4.1.1.0.2.1.gc22af88.src.rpm (mlnx-ofa_kernel-4.1.tgz)"
SERIES="4.4"
PLATFORMS="broadwell broadwellnk broadwellnkv2 broadwellntbap denverton purley r1000 v1000"
FETCH_URL="https://linux.mellanox.com/public/repo/mlnx_ofed/4.1-1.0.2.0/SRPMS/mlnx-ofa_kernel-4.1-OFED.4.1.1.0.2.1.gc22af88.src.rpm"
FETCH_KEY="mlnx-ofa_kernel-4.1-OFED.4.1.1.0.2.1.gc22af88.src.rpm"
FETCH_INNER="mlnx-ofa_kernel-*.tgz"
BUILD="make"
MAKE_ARGS="-f arc-ofed.mk KVER=@RELEASE@ KSRC=@KSRC@"

oot_prepare() {
  cp "${s}/arc-ofed.mk" .
  # 2017 code, today's compiler: its -Werror (x86_64, gcc >= 4.4.4) stops
  # at warnings gcc 12 adds
  sed -i 's/echo "-Werror"; else echo ""; fi)/echo ""; fi)/' makefile
  ! grep -q 'echo "-Werror"' makefile
}
