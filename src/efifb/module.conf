# efifb (firmware framebuffer) as a module for apollolake and geminilake,
# as the prebuilt set had it there (FB_EFI is a bool, off in the official
# kernels). From the target's kernel source.
ORIGIN="GPL kernel source: drivers/video/fbdev/efifb.c"
SERIES="4.4"
PLATFORMS="apollolake geminilake"
KERNEL_FILES="drivers/video/fbdev/efifb.c"

oot_prepare() {
  # The per-machine mode table (efifb_dmi_list) lives in vmlinux's
  # sysfb_efi.c, which the official kernels do not build: an empty table of
  # its own (no quirk applies) instead.
  sed -i '0,/^#include/s//#define efifb_dmi_list arc_efifb_dmi_list\n#include/' efifb.c
  sed -i 's|^#include <asm/sysfb.h>$|#include <asm/sysfb.h>\nstruct efifb_dmi_info arc_efifb_dmi_list[M_UNKNOWN];|' efifb.c
  grep -q '^struct efifb_dmi_info arc_efifb_dmi_list' efifb.c
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
