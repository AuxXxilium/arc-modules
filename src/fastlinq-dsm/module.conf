# Marvell (QLogic) FastLinQ 8.33.9.0 qed and qede, the version DSM itself
# ships on these platforms (Synology-signed qed, qede and qedr 8.33.9.0,
# which the prebuilt set copied): the same source, so DSM's own qedr (built
# on DSM's OFED and qed) loads on these. qedr itself is not built here:
# its Makefile cannot build against Mellanox OFED 4.1, which DSM's is
# built on. Marvell no longer publishes 8.33.9.0; this is QLogic's tarball as
# an Ubuntu PPA packages it (its .dsc pins the same sha256).
ORIGIN="https://ppa.launchpadcontent.net/yarmouth-team/fastlinq/ubuntu/pool/main/f/fastlinq/fastlinq_8.33.9.0.orig.tar.bz2"
SERIES="4.4"
PLATFORMS="broadwell broadwellnk broadwellnkv2 broadwellntbap denverton purley r1000 v1000"
FETCH_URL="https://ppa.launchpadcontent.net/yarmouth-team/fastlinq/ubuntu/pool/main/f/fastlinq/fastlinq_8.33.9.0.orig.tar.bz2"
BUILD="make"
MAKE_ARGS="KVER=@RELEASE@ KERNEL_DIR=@KSRC@ LINUXSRC=@KSRC@ DISABLE_WERROR=1 subsystem"

oot_prepare() {
  # qed and qede only; ${PWD} is the caller's folder under make -C
  sed -i -e 's|^SUBDIRS := .*|SUBDIRS := $(QED_DIR) $(QEDE_DIR)|' \
    -e 's|\${PWD}|$(CURDIR)|g' Makefile
  grep -q '^SUBDIRS := $(QED_DIR) $(QEDE_DIR)$' Makefile
  # qede forces CONFIG_DCB; without DCB in the kernel, qede without its DCB
  # part
  if ! grep -q '^CONFIG_DCB=y' "${OOT_OFFICIAL_CONFIG}"; then
    sed -i 's/ -DCONFIG_DCB$//' qede-*/src/Makefile
  fi
  # Synology's 4.4 declares prandom_bytes() in <linux/prandom.h> (5.10's
  # layout), where the Makefile's probe of <linux/random.h> does not look
  if grep -q 'prandom_bytes' "${OOT_KSRC}/include/linux/prandom.h" 2>/dev/null; then
    sed -i '/-D_DEFINE_PRANDOM_BYTES_/d' qed-*/src/Makefile qede-*/src/Makefile
  fi
  # Synology's 4.4 already has page_ref_count() (not page_ref_inc()): only
  # the one the kernel lacks stays in qede's compat header
  if grep -q 'static inline int page_ref_count' "${OOT_KSRC}/include/linux/mm.h"; then
    sed -i '/^static inline int page_ref_count/,/^}/d' qede-*/src/qede_compat.h
  fi
}
