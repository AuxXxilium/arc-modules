# cpufreq ondemand and conservative governors, with the common governor
# code they need (cpufreq_governor, a bool in the kernel), as modules, from
# the target's kernel source. Where the official kernel builds the common
# code in, cpufreq_governor.ko exports what vmlinux has and is dropped by
# the check; the governors then use vmlinux's.
# 4.4 only: on 5.10 the common code needs cpufreq_this_cpu_can_update(),
# which vmlinux does not export.
ORIGIN="GPL kernel source: drivers/cpufreq/cpufreq_{governor,ondemand,conservative}*"
SERIES="4.4"
KERNEL_FILES="drivers/cpufreq/cpufreq_governor*.[ch] drivers/cpufreq/cpufreq_ondemand.[ch] drivers/cpufreq/cpufreq_conservative.c"
UNLESS_OFFICIAL="CONFIG_CPU_FREQ_GOV_ONDEMAND"

oot_prepare() {
  # 5.10 splits the attribute set helpers out (GOV_ATTR_SET): their own module
  if [ -f cpufreq_governor_attr_set.c ]; then
    printf 'obj-m += cpufreq_governor_attr_set.o\n' >>Kbuild
  fi
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
