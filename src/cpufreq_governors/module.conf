# cpufreq ondemand and conservative governors, with the common governor
# code they need (cpufreq_governor, a bool in the kernel), as modules, from
# the target's kernel source. Where the official kernel builds the governors
# in, the source is skipped; where it builds only the common code in,
# cpufreq_governor.ko exports what vmlinux has and is dropped by the check,
# and the governors use vmlinux's.
ORIGIN="GPL kernel source: drivers/cpufreq/cpufreq_{governor,ondemand,conservative}*"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/cpufreq/cpufreq_governor.[ch] drivers/cpufreq/cpufreq_ondemand.[ch] drivers/cpufreq/cpufreq_conservative.c"
UNLESS_OFFICIAL="CONFIG_CPU_FREQ_GOV_ONDEMAND"

oot_prepare() {
  # 5.10: the common code asks cpufreq_this_cpu_can_update() (kernel/sched,
  # used by schedutil, not exported). Its first half is all a governor
  # running on the policy's own CPUs needs; an update from another CPU is
  # skipped, the policy's own CPU takes the next one.
  if grep -q 'cpufreq_this_cpu_can_update' cpufreq_governor.c; then
    sed -i 's|^#include "cpufreq_governor.h"$|#include "cpufreq_governor.h"\
\
/* arc-modules: cpufreq_this_cpu_can_update() is not exported */\
static bool arc_cpufreq_this_cpu_can_update(struct cpufreq_policy *policy)\
{\
\treturn cpumask_test_cpu(smp_processor_id(), policy->cpus);\
}\
#define cpufreq_this_cpu_can_update arc_cpufreq_this_cpu_can_update|' cpufreq_governor.c
    grep -q '^#define cpufreq_this_cpu_can_update arc_' cpufreq_governor.c
  fi
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
