# phy-lgm-usb (Intel Lightning Mountain USB PHY), built on its own against the
# USB PHY module (src/usb_phy) and the header's regulator stubs, the way the
# prebuilt set had it (its Kconfig selects USB_PHY and REGULATOR, bools off
# here). It loads; it binds only an LGM device-tree node.
ORIGIN="GPL kernel source: drivers/phy/phy-lgm-usb.c"
SERIES="5.10"
KERNEL_FILES="drivers/phy/phy-lgm-usb.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
