# mtk-sd (MediaTek SD/MMC host), built on its own against mmc_core/cqhci
# and the header's regulator stubs, the way the prebuilt set had it (its
# Kconfig selects REGULATOR, a bool off here). It loads; it binds only a
# MediaTek device-tree node.
ORIGIN="GPL kernel source: drivers/mmc/host/mtk-sd.c"
SERIES="5.10"
KERNEL_FILES="drivers/mmc/host/mtk-sd.c drivers/mmc/host/cqhci.h"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
