# ALSA library modules without a prompt that only SoC drivers select:
# snd-pcm-dmaengine, snd-compress and the HDA extended core
# (snd-hda-ext-core), as the prebuilt set had them, from the target's kernel
# source. On 4.4 without the HDA extended core: Synology's 4.4 HDA core
# lacks what it uses (_snd_hdac_chip_read()).
ORIGIN="GPL kernel source: sound/core/pcm_dmaengine.c, sound/core/compress_offload.c, sound/hda/ext/"
SERIES="4.4 5.10"
KERNEL_FILES="sound/core/pcm_dmaengine.c sound/core/compress_offload.c sound/hda/ext/hdac_ext_*.c"

oot_prepare() {
  # Synology's 4.4 sound/soc.h uses the regmap cache API without including
  # <linux/regmap.h>
  sed -i '0,/^#include/s//#include <linux\/regmap.h>\n#include/' pcm_dmaengine.c
}
