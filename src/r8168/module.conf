# Realtek r8168 8.057.00 (1G), vendor driver as released, mirrored by JenkingWu.
ORIGIN="https://github.com/JenkingWu/r8168-8.057.00 ae1afbce8488"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/JenkingWu/r8168-8.057.00/tar.gz/ae1afbce8488bfd7786dda3273bd2904ba538a61"
FETCH_KEY="r8168-8.057.00-ae1afbce8488.tar.gz"
SUBDIR="src"
MAKE_ARGS="ENABLE_MULTIPLE_TX_QUEUE=y ENABLE_S5_KEEP_CURR_MAC=y"

# r8168.h defines netdev_err() as a macro when it "is not defined", but the
# kernel's is a function, so the macro then breaks the kernel's own
# netif_err(). Drop that fallback (every kernel since 2.6.36 has it).
oot_prepare() {
  awk 'skip>0 {skip--; next} /^#ifndef netdev_err$/ {skip=6; next} {print}' src/r8168.h >src/r8168.h.new
  mv src/r8168.h.new src/r8168.h
  ! grep -q '^#define netdev_err' src/r8168.h
  # Synology's 4.4 predates NETIF_F_CSUM_MASK (4.5), the old name is
  # NETIF_F_ALL_CSUM.
  if ! grep -q NETIF_F_CSUM_MASK "${OOT_KSRC}/include/linux/netdev_features.h"; then
    sed -i '0,/^#include/s//#define NETIF_F_CSUM_MASK NETIF_F_ALL_CSUM\n#include/' src/r8168_n.c
  fi
}
