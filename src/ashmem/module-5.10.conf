# 5.10: the kernel's own staging ashmem (a bool the official kernels have
# off) as the module ashmem_linux, from the target's kernel source, the way
# the prebuilt set had it. It uses shmem_zero_setup(), which vmlinux has but
# does not export; 5.10/arc-ksyms.c finds it by name at load time.
ORIGIN="GPL kernel source: drivers/staging/android/ashmem.[ch], uapi/ashmem.h"
SERIES="5.10"
FETCH_URL=""
SUBDIR="."
KERNEL_FILES="drivers/staging/android/ashmem.[ch] drivers/staging/android/uapi"

oot_prepare() {
  # a module: its init first finds the unexported function
  sed -i 's|^device_initcall(ashmem_init);$|int arc_ksyms_init(void);\
\
static int __init arc_ashmem_init(void)\
{\
\tint ret = arc_ksyms_init();\
\
\treturn ret ? ret : ashmem_init();\
}\
module_init(arc_ashmem_init);|' ashmem.c
  grep -q '^module_init(arc_ashmem_init);$' ashmem.c
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  grep -q MODULE_LICENSE ashmem.c || printf '\nMODULE_LICENSE("GPL");\n' >>ashmem.c
}
