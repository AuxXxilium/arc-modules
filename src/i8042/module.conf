# i8042, the PC keyboard/mouse controller, as a module where the official
# kernel has it off. Turning SERIO_I8042 on in the configuration would make
# the official builtin libps2 modular (an ABI change), so it is built on its
# own from the target's kernel source; <linux/i8042.h> is told it is there.
ORIGIN="GPL kernel source: drivers/input/serio/i8042*"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/input/serio/i8042.c drivers/input/serio/i8042*.h"
UNLESS_OFFICIAL="CONFIG_SERIO_I8042"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
