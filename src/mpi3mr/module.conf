# Broadcom mpi3mr (9600 tri-mode HBAs) 8.5.1.0.0, for 5.10 only: it needs
# blk-mq-pci (4.9+). The 5.10 port (mpi3mr_compat.h) is dsm_linux_fix's.
ORIGIN="dsm_linux_fix 774ca3c47ec2: drivers/scsi/mpi3mr"
SERIES="5.10"
MAKE_ARGS="CONFIG_SCSI_MPI3MR=m"

# SAS-4 22.5 Gbps (12 in enum sas_linkrate) arrived in 5.18; dsm_linux_fix
# adds it to its own kernel's scsi_transport_sas.h, the official 5.10 lacks it.
oot_prepare() {
  grep -q SAS_LINK_RATE_22_5_GBPS "${OOT_KSRC}/include/scsi/scsi_transport_sas.h" ||
    printf '\n#ifndef SAS_LINK_RATE_22_5_GBPS\n#define SAS_LINK_RATE_22_5_GBPS 12\n#endif\n' >>mpi3mr_compat.h
}
