# Intel iavf 4.13.78, Intel's out-of-tree driver (newer than the kernel's own and
# knowing more devices). Pinned download, checksum in checksums.sha256.
ORIGIN="https://github.com/intel/ethernet-linux-iavf v4.13.78"
SERIES="4.4 5.10"
FETCH_URL="https://github.com/intel/ethernet-linux-iavf/releases/download/v4.13.78/iavf-4.13.78.tar.gz"
SUBDIR="src"
BUILD="intel"

# 4.13.20 (the prebuilt set's) also bound 0x0DD5, Intel's Scalable IOV
# device (IAVF_DEV_ID_VDEV), as a plain VF; later releases dropped the ID,
# the VF code it used is unchanged. It goes back in where it is gone (4.5.3,
# for 4.4, still has it).
oot_prepare() {
  grep -q 'IAVF_DEV_ID_VDEV' src/iavf_devids.h && return 0
  sed -i 's|^#define IAVF_DEV_ID_X722_VF\t\t0x37CD$|#define IAVF_DEV_ID_VDEV\t\t0x0DD5\n&|' src/iavf_devids.h
  sed -i 's|^\t{PCI_VDEVICE(INTEL, IAVF_DEV_ID_ADAPTIVE_VF), 0},$|&\n\t{PCI_VDEVICE(INTEL, IAVF_DEV_ID_VDEV), 0},|' src/iavf_main.c
  sed -i 's|^\t\tcase IAVF_DEV_ID_ADAPTIVE_VF:$|&\n\t\tcase IAVF_DEV_ID_VDEV:|' src/iavf_common.c
  grep -q 'IAVF_DEV_ID_VDEV' src/iavf_devids.h && grep -q 'IAVF_DEV_ID_VDEV), 0}' src/iavf_main.c     && grep -q 'case IAVF_DEV_ID_VDEV:' src/iavf_common.c
}
