# Google Coral Edge TPU (gasket + apex) for 4.4 (5.10 has them in staging).
ORIGIN="https://github.com/google/gasket-driver 5815ee3908a4"
SERIES="4.4"
FETCH_URL="https://codeload.github.com/google/gasket-driver/tar.gz/5815ee3908a46a415aac616ac7b9aedcb98a504c"
FETCH_KEY="gasket-driver-5815ee3908a4.tar.gz"
SUBDIR="src"
MAKE_ARGS="CONFIG_STAGING_GASKET_FRAMEWORK=m CONFIG_STAGING_APEX_DRIVER=m"

# MODULE_IMPORT_NS() arrived in 5.4; on 4.4 there are no namespaces to import.
oot_prepare() {
  for f in $(grep -l MODULE_IMPORT_NS src/*.c); do
    sed -i '1i #include <linux/module.h>\n#ifndef MODULE_IMPORT_NS\n#define MODULE_IMPORT_NS(ns)\n#endif' "${f}"
  done
}
