# GPU: the whole DRM stack, i915 and amdgpu, from linux-backport (Intel's
# i915 backports MT_65_24.1.19_PSB_240119.1, i915 of DII d8b384342b641, plus
# amdgpu from Linux 6.5; the tree dsm_linux_fix builds for arc's own kernel).
#
# The official 5.10 kernels (all but geminilakenk) have no DRM and are built
# without DMA_SHARED_BUFFER, SYNC_FILE and HDMI, so the kernel's own drm.ko
# cannot load. The backport brings all of that as modules of its own:
# dmabuf.ko (dma-buf, dma-fence, sync_file), i915-compat.ko (the backport's
# compat layer and the bits of vmlinux it needs), drm, drm_kms_helper, ttm,
# drm_buddy, drm_display_helper, gpu-sched, ..., i915, amdgpu, and mei for
# i915's HuC/GSC. This is how arc's prebuilt i915 for those platforms was
# made (their modinfo carries the same backports tag).
#
# None of these types is used by the official vmlinux (it has no dma-buf
# at all), so the backport's own definitions are not an ABI change there.
# Where the official kernel does have DRM (geminilakenk) the backport is not
# built: its drm.ko would replace DSM's, under DSM's own i915.
#
# (The folder is not called linux-backport: in a trace header's include path
# the compiler expands the token "linux" to 1.)
#
# The repository is private: the fetch needs a GitHub token in
# ARC_GITHUB_TOKEN (or AUX_TOKEN). It is pinned by commit.
ORIGIN="https://github.com/AuxXxilium/linux-backport (branch i915) adf82d2d52bf"
SERIES="5.10"
GIT_URL="https://github.com/AuxXxilium/linux-backport.git"
GIT_COMMIT="adf82d2d52bf1335d49dd44c90a8d1d13fb5bf4b"
BUILD="backport"
BACKPORT_DEFCONFIG="defconfig-amdgpu"
UNLESS_OFFICIAL="CONFIG_DRM"

# The same fixups dsm_linux_fix's build_i915_backport applies, keyed off the
# official kernel instead of dsm_linux_fix's, plus one for POWER_SUPPLY.
oot_prepare() {
  local cfg="${OOT_KSRC}/.config" inc="${OOT_KSRC}/include/linux"
  local bpm=backport-include/backport/backport_macro.h
  has() { grep -q "^$1=y" "${cfg}"; }

  # Exports the official vmlinux already has must not be exported twice.
  if has CONFIG_DMA_SHARED_BUFFER; then
    sed -i '/^EXPORT_TRACEPOINT_SYMBOL(dma_fence_signaled);/d' drivers/dma-buf/dma-fence.c
  fi
  if has CONFIG_HDMI; then
    sed -i '/^EXPORT_SYMBOL(hdmi_[a-z_]*);$/d' drivers/video/hdmi.c
  fi
  if has CONFIG_DRM_PANEL_ORIENTATION_QUIRKS; then
    sed -i 's|^// #define BPM_DRM_GET_PANEL_ORIENTATION_QUIRK_DONT_EXPORT$|#define BPM_DRM_GET_PANEL_ORIENTATION_QUIRK_DONT_EXPORT|' "${bpm}"
  fi
  # INTEL_GTT=y (geminilakenk): vmlinux exports intel_gmch_probe/remove
  # (the intel_gtt_* ones under their old names); the backport's intel-gtt
  # keeps its renamed intel_gmch_gtt_* exports, as the prebuilt one did.
  if has CONFIG_INTEL_GTT; then
    sed -i '/^EXPORT_SYMBOL(intel_gmch_\(probe\|remove\));$/d' drivers/char/agp/intel-gtt.c
    if grep -q '^EXPORT_SYMBOL(intel_gmch_\(probe\|remove\));$' drivers/char/agp/intel-gtt.c; then return 1; fi
  fi
  if has CONFIG_DRM_MIPI_DSI; then
    sed -i -E '/^EXPORT_SYMBOL(_GPL)?\([a-z_0-9]+\);$/d' drivers/gpu/drm/drm_mipi_dsi.c
  fi

  # Shims for functions this kernel already has.
  if grep -qE '^[[:space:]]*(static inline )?bool of_property_present\(' "${inc}/of.h"; then
    printf '\n#define BPM_OF_PROPERTY_PRESENT_AVAILABLE /* host */\n' >>"${bpm}"
  fi
  if grep -qE '^[[:space:]]*void device_set_node\(' "${inc}/device.h"; then
    sed -i 's|^#define BPM_DEVICE_SET_NODE_NOT_PRESENT$|/* host has device_set_node() */|' "${bpm}"
  fi
  if [ -f "${inc}/cc_platform.h" ] && grep -qE '^[[:space:]]*bool cc_platform_has\(' "${inc}/cc_platform.h"; then
    sed -i 's|^#define BPM_CC_PLATFORM_HAS_NOT_PRESENT$|/* host has cc_platform_has() */|' "${bpm}"
  fi
  if grep -q 'list_cmp_func_t' "${inc}/list_sort.h"; then
    sed -i 's|^#define BPM_LIST_CMP_FUNC_T_NOT_PRESENT$|/* host has list_cmp_func_t */|' "${bpm}"
  fi

  # amdgpu as an external module: no $(srctree) in its own paths, and a
  # stub for the display-core header the headless build does not carry.
  sed -i 's|^FULL_AMD_PATH=$(srctree)/$(src)/\.\.$|FULL_AMD_PATH=$(src)/..|' drivers/gpu/drm/amd/amdgpu/Makefile
  if [ ! -d drivers/gpu/drm/amd/display ] && [ ! -f drivers/gpu/drm/amd/include/dm_services_types.h ]; then
    printf '/* SPDX-License-Identifier: MIT */\n/* stub: headless amdgpu has no display core (see dsm_linux_fix) */\n#ifndef _DM_SERVICES_TYPES_STUB_H_\n#define _DM_SERVICES_TYPES_STUB_H_\n#include <linux/types.h>\n#endif\n' \
      >drivers/gpu/drm/amd/include/dm_services_types.h
  fi

  # amdgpu only asks the power-supply class whether the system is on AC.
  # The official kernels have no such class (and it cannot be added without
  # changing vmlinux); its stub says -ENOSYS, which amdgpu would read as
  # "on battery". A NAS runs on AC.
  if ! has CONFIG_POWER_SUPPLY; then
    sed -i '/^\tdepends on POWER_SUPPLY$/d' drivers/gpu/drm/amd/amdgpu/Kconfig
    sed -i 's/power_supply_is_system_supplied() > 0/(IS_ENABLED(CONFIG_POWER_SUPPLY) ? power_supply_is_system_supplied() > 0 : 1)/' \
      drivers/gpu/drm/amd/amdgpu/amdgpu_acpi.c drivers/gpu/drm/amd/amdgpu/amdgpu_device.c drivers/gpu/drm/amd/pm/amdgpu_dpm.c
    [ "$(grep -c 'IS_ENABLED(CONFIG_POWER_SUPPLY)' drivers/gpu/drm/amd/amdgpu/amdgpu_acpi.c \
          drivers/gpu/drm/amd/amdgpu/amdgpu_device.c drivers/gpu/drm/amd/pm/amdgpu_dpm.c | awk -F: '{s+=$2} END {print s}')" -eq 3 ]
  fi
}
