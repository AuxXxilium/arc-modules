# phy-mt65xx-usb3 (MediaTek USB3 PHY, generic PHY framework, which these
# kernels have built in), built on its own against the header's OF stubs, the
# way the prebuilt set had it (its Kconfig wants ARCH_MEDIATEK). It loads; it
# binds only a MediaTek device-tree node.
ORIGIN="GPL kernel source: drivers/phy/phy-mt65xx-usb3.c"
SERIES="4.4"
IF_OFFICIAL="CONFIG_GENERIC_PHY"
KERNEL_FILES="drivers/phy/phy-mt65xx-usb3.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
