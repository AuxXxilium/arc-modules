# The phylib drivers of r1000 and v1000, which these kernels' own source
# cannot build: their phylib has the 4.5 mdio_device layout
# (CONFIG_SYNO_AMD_XGBE_PORTING: phy_device->mdio, mii_bus->mdio_map, an irq
# array in mii_bus), and Synology ported tg3, b44, the Broadcom, Realtek and
# Microchip PHY drivers, lan78xx and asix to it, but only for its Marvell
# Armada kernels (CONFIG_SYNO_LSP_ARMADA_16_12). They are built from the
# target's kernel source with that port turned on for the AMD option too
# (mdio-compat.py). PHYLIB itself is built in there.
ORIGIN="GPL kernel source: drivers/net/ethernet/broadcom/{tg3,b44}, drivers/net/phy/{bcm-phy-lib,broadcom,realtek,microchip}, drivers/net/usb/{lan78xx,asix*,ax88172a}"
SERIES="4.4"
PLATFORMS="r1000 v1000"
KERNEL_FILES="drivers/net/ethernet/broadcom/tg3.[ch] drivers/net/ethernet/broadcom/b44.[ch] drivers/net/phy/bcm-phy-lib.[ch] drivers/net/phy/broadcom.c drivers/net/phy/realtek.c drivers/net/phy/microchip.c drivers/net/usb/lan78xx.[ch] drivers/net/usb/asix*.[ch] drivers/net/usb/ax88172a.c"

oot_prepare() {
  # only where phylib has the mdio_device layout
  grep -q 'struct mdio_device mdio;' "${OOT_KSRC}/include/linux/phy.h"
  python3 -I "${s}/mdio-compat.py" --genphy "${OOT_KSRC}/drivers/net/phy/phy_device.c" *.c *.h
}
