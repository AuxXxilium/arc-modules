# qcaspi (Qualcomm QCA7000 powerline over SPI) where the official kernel has
# no OF, built on its own against the header's OF stubs, the way the prebuilt
# set had it (with OF the in-tree build is used). It loads; it binds an SPI
# device, which these boards only describe in a device tree.
ORIGIN="GPL kernel source: drivers/net/ethernet/qualcomm/qca_*"
SERIES="4.4"
UNLESS_OFFICIAL="CONFIG_OF"
KERNEL_FILES="drivers/net/ethernet/qualcomm/qca_*.[ch]"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
