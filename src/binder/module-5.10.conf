# 5.10: the kernel's own binder (drivers/android, a bool the official
# kernels have off) as the module binder_linux, from the target's kernel
# source, the way the prebuilt set had it. It uses ten functions vmlinux has
# but does not export; 5.10/arc-ksyms.c finds them by name at load time.
# /dev/binder, /dev/hwbinder and /dev/vndbinder are created (no binderfs).
ORIGIN="GPL kernel source: drivers/android/binder*.[ch]"
SERIES="5.10"
FETCH_URL=""
SUBDIR="."
KERNEL_FILES="drivers/android/binder.c drivers/android/binder_alloc.[ch] drivers/android/binder_internal.h drivers/android/binder_trace.h"

oot_prepare() {
  # a module: its init first finds the unexported functions
  sed -i 's|^device_initcall(binder_init);$|int arc_ksyms_init(void);\
\
static int __init arc_binder_init(void)\
{\
\tint ret = arc_ksyms_init();\
\
\treturn ret ? ret : binder_init();\
}\
module_init(arc_binder_init);|' binder.c
  grep -q '^module_init(arc_binder_init);$' binder.c
}
