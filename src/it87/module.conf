# ITE IT87xx Super I/O hardware monitoring (it87), frankcrawford's
# out-of-tree driver: the prebuilt set shipped this one (IT8528E, IT8613E,
# IT8622E, IT8625E, IT8655E, IT8665E, IT8686E, IT8688E, IT8689E, IT8792E,
# IT87952E, ... and the DMI table of boards that need a quirk), the kernel's
# own it87 knows far fewer chips. Where the official kernel has it87 built
# in (SENSORS_IT87=y: broadwell*, purley, icelaked) the builtin stays.
ORIGIN="https://github.com/frankcrawford/it87 8fdc406fff14"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/frankcrawford/it87/tar.gz/8fdc406fff148c033d7535a1ac3d905f77edf3cb"
FETCH_KEY="it87-8fdc406fff14.tar.gz"
UNLESS_OFFICIAL="CONFIG_SENSORS_IT87"
# the Makefile takes its version from git, which a tarball has not
MAKE_ARGS="DRIVER_VERSION=8fdc406fff14"

# The driver's compat.h targets newer kernels than 4.4/5.10: its
# class_create(name) wrapper for < 6.4 replaces the kernel's own
# class_create(owner, name) macro instead of calling it, 4.4 has no
# fallthrough, and device_is_bound() is not exported to modules (4.4 lacks
# it altogether): a bound device has its driver set.
oot_prepare() {
  sed -i 's|^#define class_create(name) class_create(THIS_MODULE, name)$|/* class_create(THIS_MODULE, name) is called directly (arc-modules) */|' compat.h
  grep -q 'class_create(THIS_MODULE, name) is called directly' compat.h
  sed -i 's|class_create("gigabyte")|class_create(THIS_MODULE, "gigabyte")|' it87.c
  grep -q 'class_create(THIS_MODULE, "gigabyte")' it87.c
  {
    echo '#ifndef fallthrough'
    echo '#define fallthrough do {} while (0)'
    echo '#endif'
    echo '#define device_is_bound(dev) ((dev)->driver != NULL)'
  } >arc-compat.h
  sed -i 's|^#include "compat.h"$|#include "compat.h"\n#include "arc-compat.h"|' it87.c
  grep -q '^#include "arc-compat.h"$' it87.c
}
