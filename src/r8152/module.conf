# Realtek r8152 2.22.1 (USB 1G/2.5G/5G), vendor driver via awesometic's DKMS package.
ORIGIN="https://github.com/awesometic/realtek-r8152-dkms c1034ab62ddc (2.22.1)"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/awesometic/realtek-r8152-dkms/tar.gz/c1034ab62ddc48383118598f43c3227fc53c309e"
FETCH_KEY="r8152-2.22.1-c1034ab62ddc.tar.gz"
SUBDIR="src"

# Synology's 4.4 predates netif_trans_update() (4.7) and in_compat_syscall()
# (4.6), which the driver uses without a fallback: the 4.7 body of the one
# and the older name of the other.
oot_prepare() {
  if ! grep -q 'netif_trans_update' "${OOT_KSRC}/include/linux/netdevice.h"; then
    cat >src/arc-compat.h <<'EOH'
/* arc-modules: what Synology's 4.4 lacks */
#include <linux/compat.h>

static inline void netif_trans_update(struct net_device *dev)
{
	struct netdev_queue *txq = netdev_get_tx_queue(dev, 0);

	if (txq->trans_start != jiffies)
		txq->trans_start = jiffies;
}
EOH
    if ! grep -q 'in_compat_syscall' "${OOT_KSRC}/include/linux/compat.h"; then
      printf '#define in_compat_syscall() is_compat_task()\n' >>src/arc-compat.h
    fi
    # after the driver's own includes
    awk '!done && /^#include "compatibility.h"$/ { print; print "#include \"arc-compat.h\""; done = 1; next } { print }' \
      src/r8152.c >src/r8152.c.new
    mv src/r8152.c.new src/r8152.c
    grep -q '#include "arc-compat.h"' src/r8152.c
  fi
}
