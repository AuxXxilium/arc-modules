# The USB PHY framework (drivers/usb/phy/phy.c, the "phy" module) under the
# USB_PHY bool the official kernels have off, as a module from the target's
# kernel source, as the prebuilt set had it. <linux/usb/phy.h> is told it
# is there (otherwise it brings its own inline stubs).
ORIGIN="GPL kernel source: drivers/usb/phy/phy.c"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/usb/phy/phy.c"
UNLESS_OFFICIAL="CONFIG_USB_PHY"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
