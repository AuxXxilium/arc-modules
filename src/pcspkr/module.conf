# The PC speaker: the platform device (pcspeaker, arch/x86/kernel/pcspeaker.c,
# under the PCSPKR_PLATFORM bool the official kernels have off) and its input
# driver (pcspkr), as modules from the target's kernel source.
ORIGIN="GPL kernel source: arch/x86/kernel/pcspeaker.c, drivers/input/misc/pcspkr.c"
SERIES="4.4 5.10"
KERNEL_FILES="arch/x86/kernel/pcspeaker.c drivers/input/misc/pcspkr.c"
UNLESS_OFFICIAL="CONFIG_PCSPKR_PLATFORM CONFIG_INPUT_PCSPKR"

oot_prepare() {
  # built as a module, its device_initcall() comes from <linux/module.h>
  sed -i '0,/^#include/s//#include <linux\/module.h>\n#include/' pcspeaker.c
  # pcspeaker.c only registers its device: an exit that removes it again
  cat "${s}/arc-exit.c.in" >>pcspeaker.c
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
