# dimlib (dynamic interrupt moderation, lib/dim), a bool geminilakenk is
# built without, as the module dimlib.ko from the target's kernel source, the
# way the prebuilt set had it (mlx5_core, bnxt_en, ib_core). A library:
# vmlinux has no user of it.
ORIGIN="GPL kernel source: lib/dim/{dim,net_dim,rdma_dim}.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_DIMLIB"
KERNEL_FILES="lib/dim/dim.c lib/dim/net_dim.c lib/dim/rdma_dim.c"
oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
