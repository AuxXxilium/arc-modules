# Tehuti TN40xx 10GbE (tn40xx), the vendor driver as acooks/tn40xx-driver
# keeps it: release tn40xx-006 (vendor 0.3.6.17.2 plus fixes for newer
# kernels), the same commit dsm_linux_fix vendors, built as the vendor's
# "jumbo" driver with every PHY on (QT2025, TLK10232, AQR105, Mustang CX4,
# the Marvell MV88X3120/MV88X3310/MV88E2010), so every card in its PCI
# table binds. The Marvell PHYs load firmware from C headers the release
# branch leaves out; firmware/ holds the ones dsm_linux_fix generated with
# the vendor's mvidtoh.sh from the StarTech drop (f9332bf): 88X3140-FW-
# R02-06-03, x3310fw/e2010fw 0.2.8.0.8850. The prebuilt set had 0.3.6.14 on
# 4.4 until defe03c62 dropped it; it never had a 5.10 build.
ORIGIN="https://github.com/acooks/tn40xx-driver release/tn40xx-006 a1783620a2da"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/acooks/tn40xx-driver/tar.gz/a1783620a2da70bdb5d7d3e65ad196451a41d825"
FETCH_KEY="tn40xx-006-a1783620a2da.tar.gz"
# the Makefile's PHY detection looks for the firmware headers in make's
# folder, which under kbuild is the kernel tree: the Marvell ones are named
MAKE_ARGS="EXPECTED_KDIR=@KSRC@ JUMBO_MV88X3120=YES JUMBO_MV88X3310=YES JUMBO_MV88E2010=YES"

# Release 006 uses kernel interfaces newer than 4.4 (and one newer than
# 5.10): compat/ gives the ones this kernel lacks, with the bodies the kernel
# later got, in arc-compat.h after the driver's includes.
oot_prepare() {
  cp "${s}"/firmware/*.h .
  local k="${OOT_KSRC}/include/linux"
  : >arc-compat.h
  grep -q 'eth_hw_addr_set' "${k}/etherdevice.h" || cat "${s}/compat/eth_hw_addr_set.h" >>arc-compat.h
  grep -q 'netif_trans_update' "${k}/netdevice.h" || cat "${s}/compat/netif_trans_update.h" >>arc-compat.h
  grep -q 'pci_alloc_irq_vectors' "${k}/pci.h" || cat "${s}/compat/pci_alloc_irq_vectors.h" >>arc-compat.h
  # net_device has no min_mtu/max_mtu before 4.10; bdx_change_mtu() checks
  # the same bounds itself
  if ! grep -q 'max_mtu;' "${k}/netdevice.h"; then
    sed -i '/ndev->min_mtu = ETH_ZLEN;/d; /ndev->max_mtu = BDX_MAX_MTU;/d' tn40.c
  fi
  sed -i 's|^#include "tn40_ioctl.h"$|#include "tn40_ioctl.h"\n#include "arc-compat.h"|' tn40.h
  grep -q '^#include "arc-compat.h"$' tn40.h
}
