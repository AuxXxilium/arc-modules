# Marvell (Aquantia) AQtion atlantic 2.5.12, the vendor driver, the version
# the prebuilt set had (GitHub's Aquantia/AQtion stops at 2.5.5). Marvell
# publishes it only as a zip on its site and drops old releases (2.5.12 is
# gone there, 2.5.16 is current): this is the Internet Archive's copy of
# Marvell's 2.5.12 zip, byte for byte (its sha512 is the one the AUR
# atlantic-dkms 2.5.12 package pins).
ORIGIN="https://www.marvell.com/content/dam/marvell/en/drivers/07-18-24_Marvell_Linux_2.5.12.zip via web.archive.org (atlantic.tar.gz)"
SERIES="4.4 5.10"
FETCH_URL="https://web.archive.org/web/20250823195125id_/https://www.marvell.com/content/dam/marvell/en/drivers/07-18-24_Marvell_Linux_2.5.12.zip"
FETCH_KEY="07-18-24_Marvell_Linux_2.5.12.zip"
FETCH_INNER="*/atlantic.tar.gz"

# Synology's 4.4 already has page_ref_count() (a backport the driver's 4.6
# compat block does not expect).
oot_prepare() {
  if grep -q 'static inline int page_ref_count' "${OOT_KSRC}/include/linux/mm.h"; then
    sed -i '/^static inline int page_ref_count/,/^}/d' aq_compat.h
  fi
}
