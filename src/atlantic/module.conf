# Marvell (Aquantia) AQtion atlantic, the vendor driver.
ORIGIN="https://github.com/Aquantia/AQtion 340d608726cb"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/Aquantia/AQtion/tar.gz/340d608726cbfa04b6046d74a362e788e1e17d45"
FETCH_KEY="AQtion-340d608726cb.tar.gz"

# Synology's 4.4 already has page_ref_count() (a backport the driver's 4.6
# compat block does not expect).
oot_prepare() {
  if grep -q 'static inline int page_ref_count' "${OOT_KSRC}/include/linux/mm.h"; then
    sed -i '/^static inline int page_ref_count/,/^}/d' aq_compat.h
  fi
}
