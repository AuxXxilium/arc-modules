# hinic (Huawei) for the 5.10 kernels built without NET_DEVLINK
# (geminilakenk), from the target's kernel source with the private devlink of
# src/mlx4-nodevlink (its health reporters then report to nobody).
ORIGIN="GPL kernel source: drivers/net/ethernet/huawei/hinic + src/mlx4-nodevlink/arc-devlink.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_NET_DEVLINK"
KERNEL_FILES="drivers/net/ethernet/huawei/hinic"
SUBDIR="hinic"
MAKE_ARGS="CONFIG_HINIC=m"

oot_prepare() {
  cp "${ROOT}/src/mlx4-nodevlink/arc-devlink.c" hinic/arc-devlink.c
  printf '\nhinic-y += arc-devlink.o\n' >>hinic/Makefile
}
