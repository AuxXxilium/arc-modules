# Microchip smartpqi (SmartRAID/SmartHBA 3100+) 2.1.42-011, Microchip's own
# driver from their GitHub (it has its own kernel compat layer). Newer than
# the prebuilt 2.1.30-031; replaces the kernel's older one on 5.10, and 4.4
# has none.
ORIGIN="https://github.com/Smart-Storage/smartpqi 2.1.42-011"
SERIES="4.4 5.10"
FETCH_URL="https://codeload.github.com/Smart-Storage/smartpqi/tar.gz/refs/tags/2.1.42-011"
FETCH_KEY="smartpqi-2.1.42-011.tar.gz"

# The compat header picks its kernel class from -DKCLASS<n><x>, which
# Microchip's Makefile.alt works out from the running kernel's version:
# 4.4 is KCLASS4A, 5.10 KCLASS5D. Synology's 4.4 also has
# ktime_get_real_seconds() backported, which the 4.4 class would define again.
oot_prepare() {
  case "${OOT_SERIES}" in
    4.4) echo 'ccflags-y += -DKCLASS4A' >>Makefile ;;
    5.10) echo 'ccflags-y += -DKCLASS5D' >>Makefile ;;
  esac
  # scsi_rescan_device() took the struct device until 6.6
  if grep -q 'scsi_rescan_device(struct device \*)' "${OOT_KSRC}/include/scsi/scsi_host.h"; then
    echo 'ccflags-y += -DKFEATURE_HAS_OLDER_SCSI_RESCAN_DEVICE' >>Makefile
  fi
  if grep -q 'ktime_get_real_seconds' "${OOT_KSRC}/include/linux/timekeeping.h"; then
    sed -i -E 's/^#define KFEATURE_HAS_KTIME_SECONDS[[:space:]]+0$/#define KFEATURE_HAS_KTIME_SECONDS 1/' smartpqi_kernel_compat.h
  fi
}
