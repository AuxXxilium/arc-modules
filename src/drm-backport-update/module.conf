# GPU on geminilakenk: the i915 backport in the package's update/ folder,
# as the prebuilt set had it there (dmabuf, i915-compat, drm, drm_kms_helper,
# drm_buddy, drm_display_helper, ttm, intel-gtt, i915, ...).
#
# geminilakenk's official kernel has DRM, dma-buf and i915, so the top level
# keeps the kernel's own drm/i915 rebuilt from source (geminilakenk.list)
# and the drivers built against them (amdgpu, bochs-drm, virtio-gpu, ...).
# The 5.10 i915 knows no GPU after Tiger Lake/Alder Lake-S; the backport
# (Intel's MT_65_24.1.19_PSB_240119.1, see src/drm-backport) adds Alder
# Lake-N/-P, Raptor Lake, Meteor/Arrow Lake, DG2, ... arc's loader takes a
# module from update/ before the top level one of the same name. The
# backport's dma-buf is its own (exports prefixed dmabufbkpt_), it does not
# clash with vmlinux's.
#
# Same private repository, commit and fixups (oot_prepare, keyed off the
# official kernel) as src/drm-backport; its drm defconfig (dma-buf, drm,
# i915, mei), no amdgpu: the top level amdgpu stays.
# shellcheck source=/dev/null
. "${ROOT}/src/drm-backport/module.conf"
BACKPORT_DEFCONFIG="defconfig-drm"
UNLESS_OFFICIAL=""
IF_OFFICIAL="CONFIG_DRM"
INSTALL_DIR="update"
