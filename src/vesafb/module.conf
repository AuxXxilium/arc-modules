# vesafb (firmware framebuffer) as a module for apollolake and geminilake,
# as the prebuilt set had it there (FB_VESA is a bool, off in the official
# kernels). From the target's kernel source.
ORIGIN="GPL kernel source: drivers/video/fbdev/vesafb.c"
SERIES="4.4"
PLATFORMS="apollolake geminilake"
KERNEL_FILES="drivers/video/fbdev/vesafb.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
