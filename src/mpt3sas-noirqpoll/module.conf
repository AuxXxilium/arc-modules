# mpt3sas for the 5.10 kernels built without IRQ_POLL (geminilakenk,
# r1000nk, v1000nk 7.2): Broadcom's 46.00 (src/mpt3sas/4.4), whose compat
# header only uses irq_poll when the kernel is new enough; here it is also
# told to leave irq_poll alone when the kernel has none. 55.00 (src/mpt3sas)
# uses irq_poll unconditionally.
ORIGIN="arc-modules test branch b74afc9a51f3: src/4.x/drivers/scsi/mpt3sas (46.00.00.00)"
SERIES="5.10"
FILES_FROM="mpt3sas/4.4"
UNLESS_OFFICIAL="CONFIG_IRQ_POLL"
MAKE_ARGS="CONFIG_SCSI_MPT3SAS=m"

oot_prepare() {
  sed -i 's/^    (LINUX_VERSION_CODE >= KERNEL_VERSION(4,6,0)))$/    (LINUX_VERSION_CODE >= KERNEL_VERSION(4,6,0))) \&\& IS_ENABLED(CONFIG_IRQ_POLL)/' mpt3sas_compatibility.h
  grep -q 'IS_ENABLED(CONFIG_IRQ_POLL)' mpt3sas_compatibility.h
}
