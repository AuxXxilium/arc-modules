# mpt3sas for the 5.10 kernels built without IRQ_POLL (geminilakenk,
# r1000nk, v1000nk 7.2): Broadcom's 53.00.00.00 (Phase 34), the newest
# release whose compat header uses irq_poll only when the kernel is new
# enough; here it is also told to leave irq_poll alone when the kernel has
# none. 55.00 (src/mpt3sas) uses irq_poll unconditionally. Broadcom's own
# download sits behind a click-through licence; Supermicro serves the same
# package openly (the hashes match Supermicro's CheckSum.txt).
ORIGIN="https://www.supermicro.com/wdl/driver/SAS/Broadcom/3808-3816-3808N/Driver/IT/Archived/Linux_Driver-RHEL8-9_SLES12-15_GEN35_PHASE_34.0_NVME.zip (mpt3sas-53.00.00.00-src.tar.gz)"
SERIES="5.10"
FETCH_URL="https://www.supermicro.com/wdl/driver/SAS/Broadcom/3808-3816-3808N/Driver/IT/Archived/Linux_Driver-RHEL8-9_SLES12-15_GEN35_PHASE_34.0_NVME.zip"
FETCH_KEY="Linux_Driver-RHEL8-9_SLES12-15_GEN35_PHASE_34.0_NVME.zip"
FETCH_INNER="*/mpt3sas-release.tar.gz!mpt3sas-53.00.00.00-src.tar.gz"
FETCH_UA="Wget"
UNLESS_OFFICIAL="CONFIG_IRQ_POLL"
MAKE_ARGS="CONFIG_SCSI_MPT3SAS=m"

oot_prepare() {
  sed -i 's/^    (LINUX_VERSION_CODE >= KERNEL_VERSION(4,6,0)))$/    (LINUX_VERSION_CODE >= KERNEL_VERSION(4,6,0))) \&\& IS_ENABLED(CONFIG_IRQ_POLL)/' mpt3sas_compatibility.h
  grep -q 'IS_ENABLED(CONFIG_IRQ_POLL)' mpt3sas_compatibility.h
  # Its spin-down guard expects the 6.5 split of manage_start_stop on any
  # kernel newer than 4.19.90 that is not RHEL/SUSE: keep the one field
  # this kernel has.
  if ! grep -q manage_system_start_stop "${OOT_KSRC}/include/scsi/scsi_device.h"; then
    sed -i -e 's/sdev->manage_system_start_stop = true;/sdev->manage_start_stop = 1;/' \
      -e '/sdev->manage_runtime_start_stop = true;/d' mpt3sas_scsih.c
    ! grep -q 'manage_system_start_stop\|manage_runtime_start_stop' mpt3sas_scsih.c
  fi
}
