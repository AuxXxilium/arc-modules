# The current release no longer builds on 4.4 (it needs <linux/sched/mm.h>
# and friends); 1.9.11 is the last one that does, the version arc shipped.
FETCH_URL="https://github.com/intel/ethernet-linux-ice/releases/download/v1.9.11/ice-1.9.11.tar.gz"

# 4.4 has no NETIF_F_HW_TC, so ice.h leaves out ice_is_adq_active(), but
# ice_lib.c calls it under HAVE_NDO_DFWD_OPS, which 4.4 has. No TC offload
# means no ADQ: give it the obvious stub.
oot_prepare() {
  sed -i '0,/^#include "ice.h"/s//#include "ice.h"\n#ifndef NETIF_F_HW_TC\nstatic inline bool ice_is_adq_active(struct ice_pf __always_unused *pf) { return false; }\n#endif/' src/ice_lib.c
  grep -q 'return false; }' src/ice_lib.c
}
