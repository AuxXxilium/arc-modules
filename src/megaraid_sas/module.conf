# Broadcom MegaRAID SAS 07.731.01.00 (MR 7.31), Broadcom's own driver; the
# kernels' are 06.808.16.00-rc1 (4.4) and 07.714.04.00-rc1 (5.10), the
# prebuilt set had 07.727.03.00 (4.4) and 07.731.01.00 (5.10). Broadcom's
# download sits behind a click-through licence; Supermicro serves the same
# package openly (the hashes match Supermicro's CheckSum.txt).
ORIGIN="https://www.supermicro.com/wdl/driver/SAS/Broadcom/3908-3916/Drivers/Archive/07.731.01.00-3_MR%207.31_Linux%20Driver.zip (megaraid_sas-07.731.01.00-src.tar.gz)"
SERIES="4.4 5.10"
FETCH_URL="https://www.supermicro.com/wdl/driver/SAS/Broadcom/3908-3916/Drivers/Archive/07.731.01.00-3_MR%207.31_Linux%20Driver.zip"
FETCH_KEY="07.731.01.00-3_MR_7.31_Linux_Driver.zip"
FETCH_INNER="*/megaraid_sas_components.tgz!megaraid_sas-07.731.01.00-src.tar.gz"
FETCH_UA="Wget"
MAKE_ARGS="CONFIG_MEGARAID_SAS=m"

oot_prepare() {
  # irq_poll by kernel version only: also only where the kernel has it
  # (geminilakenk and the nk 7.2 kernels are built without IRQ_POLL)
  sed -i 's/^\t(LINUX_VERSION_CODE >= KERNEL_VERSION(4,6,0)))$/\t(LINUX_VERSION_CODE >= KERNEL_VERSION(4,6,0))) \&\& IS_ENABLED(CONFIG_IRQ_POLL)/' megaraid_sas.h
  grep -q 'IS_ENABLED(CONFIG_IRQ_POLL)' megaraid_sas.h
}
