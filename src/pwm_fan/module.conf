# pwm-fan, the PWM-driven fan of a device tree (hwmon), as a module from the
# target's kernel source, the way the prebuilt set had it: its Kconfig needs
# the PWM core (a bool, off), so it is built on its own against the
# header's PWM stubs. It loads; it binds only a device-tree "pwm-fan" node
# with a PWM, which these kernels do not have.
ORIGIN="GPL kernel source: drivers/hwmon/pwm-fan.c"
SERIES="5.10"
UNLESS_OFFICIAL="CONFIG_SENSORS_PWM_FAN"
KERNEL_FILES="drivers/hwmon/pwm-fan.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
