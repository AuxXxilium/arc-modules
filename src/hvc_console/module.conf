# Hypervisor console core (virtio_console)
# The official kernel leaves this out of vmlinux (its bool is off), so the
# modules that need it cannot load. Built here as a module of its own from
# the target's kernel source, as arc's prebuilt packages did.
ORIGIN="GPL kernel source: drivers/tty/hvc/hvc_console.c drivers/tty/hvc/hvc_console.h"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/tty/hvc/hvc_console.c drivers/tty/hvc/hvc_console.h"

oot_prepare() {
  # 4.4 has no console_initcall() for modules (5.10 maps it to module_init)
  {
    printf '#include <linux/init.h>\n#include <linux/module.h>\n'
    printf '#if defined(MODULE) && !defined(console_initcall)\n#define console_initcall(fn) module_init(fn)\n#endif\n'
    cat hvc_console.c
  } >hvc_console.c.new && mv hvc_console.c.new hvc_console.c
  # a lib file carries no MODULE_LICENSE: without it the module may not use
  # GPL-only exports
  grep -q MODULE_LICENSE hvc_console.c ||
    printf '\nMODULE_LICENSE("GPL");\nMODULE_DESCRIPTION("Hypervisor console core (virtio_console)");\n' >>hvc_console.c
}
