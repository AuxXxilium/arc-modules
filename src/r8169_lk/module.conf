# The kernel's own r8169 driver, renamed to r8169_lk so it can sit next to
# Realtek's vendor r8169 (src/r8169). Built from the GPL kernel source of
# the target, nothing vendored here.
ORIGIN="GPL kernel source: drivers/net/ethernet/realtek/r8169*"
SERIES="4.4 5.10"

oot_prepare() {
  sed -i 's/^#define MODULENAME "r8169"/#define MODULENAME "r8169_lk"/' *.c
  grep -q 'MODULENAME "r8169_lk"' *.c
}
