# check_signature() for option ROM probing (hpsa, i2c-i801)
# The official kernel leaves this out of vmlinux (its bool is off), so the
# modules that need it cannot load. Built here as a module of its own from
# the target's kernel source, as arc's prebuilt packages did.
ORIGIN="GPL kernel source: lib/check_signature.c"
SERIES="4.4 5.10"
KERNEL_FILES="lib/check_signature.c"
# where vmlinux has it, nothing to build
UNLESS_OFFICIAL="CONFIG_CHECK_SIGNATURE"

oot_prepare() {
  # a lib file carries no MODULE_LICENSE: without it the module may not use
  # GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\nMODULE_DESCRIPTION("%s");\n' "check_signature() for option ROM probing (hpsa, i2c-i801)" >>"${f}"
  done
}
