# The framebuffer drawing helpers (cfb*/sys* copyarea, fillrect, imgblt) and
# fb_sys_fops as modules, from the target's kernel source. They are tristates
# without a prompt that only a framebuffer driver selects, so Kconfig drops
# them when nothing in our configuration selects one, although several
# official kernels ship them (official.list) and fb drivers need them.
ORIGIN="GPL kernel source: drivers/video/fbdev/core/{cfb,sys}*.c, fb_sys_fops.c"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/video/fbdev/core/cfb*.c drivers/video/fbdev/core/sys*.c drivers/video/fbdev/core/fb_sys_fops.c drivers/video/fbdev/core/fb_draw.h"
