# intel_idle, the Intel cpuidle driver, as a module. The official kernels
# have INTEL_IDLE off (a bool: builtin or nothing), so idle states come from
# ACPI only; the prebuilt set carried it as a module. From the target's
# kernel source.
ORIGIN="GPL kernel source: drivers/idle/intel_idle.c"
SERIES="4.4 5.10"
KERNEL_FILES="drivers/idle/intel_idle.c"

oot_prepare() {
  # a lib/driver file built alone may carry no MODULE_LICENSE: without it the
  # module may not use GPL-only exports
  for f in *.c; do
    grep -q MODULE_LICENSE "${f}" && continue
    printf '\n#include <linux/module.h>\nMODULE_LICENSE("GPL");\n' >>"${f}"
  done
}
