# Every target build.sh knows: one line per <platform>-<dsm>-<kernel>, the
# same names as the modules/<target>/ folders on the release branches and the
# <target>.tgz packages arc downloads.
#
# Fields are separated by ";":
#   platform ; dsm ; kernel ; GPL source build ; toolchain build ; toolchain folder
#
# GPL source build   folder under "Synology NAS GPL Source/" holding
#                    <platform>/linux-<series>.x.txz (the kernel source);
#                    "<build>/<platform>" borrows another platform's source.
#                    Synology publishes no 7.2 source for geminilakenk,
#                    r1000nk and v1000nk (their 7.3 source is used with the 7.2
#                    toolkit). "none": no usable source, the target is
#                    skipped. epyc7003ntb has no published source, and
#                    epyc7003's differs from its kernel in 131 headers (its
#                    asm-offsets do not even compile against them).
#                    The toolkit's headers replace any source header that
#                    differs; the report lists them.
# toolchain build    folder under ToolChain/toolchain/ holding the compiler
# toolchain folder   the per-platform folder name inside it (Synology names
#                    apollolake/broadwell after 4.4.180 even for 4.4.302)
#
# The dev toolkit (ds.<platform>-<dsm>.dev.txz: the official kernel's .config,
# Module.symvers, modules.order) always comes from ToolChain/toolkit/<dsm>/.
